name: iOS production dependency source

on:
  pull_request:
  push:
    branches: ['codex/ios-production-dependency-source', 'codex/ios-authorized-rpc-transport', 'codex/ios-xcm-read-only', 'feature/neon-fix-fearless']

permissions:
  contents: read

jobs:
  native-compatibility:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Swift package manifest
        run: swift package dump-package > /tmp/shared-features-package.json
      - name: Check scrypt vectors and device/simulator linkage
        run: python3 scripts/test-scrypt-architectures.py
      - name: Check SR25519 Rust signing boundary
        run: cargo test --locked --manifest-path native/sr25519crust/Cargo.toml --lib
      - name: Check SR25519 legacy vectors and iOS linkage
        run: python3 scripts/test-sr25519-native.py
      - name: Check Ed25519 and BLAKE2 sources against their pinned upstreams
        run: python3 scripts/vendor-ed25519-blake2-sources.py
      - name: Check Ed25519 and BLAKE2 vectors and parity with the replaced binaries
        run: python3 scripts/test-ed25519-blake2-native.py
      - name: Trace the replaced Ed25519 and BLAKE2 binaries to published build outputs
        run: python3 scripts/trace-ed25519-blake2-binaries.py
      - name: Reject tracked source mutations during validation
        run: git diff --exit-code

  authorized-rpc:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test production RPC sources against the pinned transport
        run: python3 scripts/test-authorized-rpc.py
      - name: Reject tracked source mutations during validation
        run: git diff --exit-code
